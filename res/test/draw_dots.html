<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
    <head>
<meta charset="UTF-8">
        <script type="text/JavaScript">
        <!--

        <script type="text/javascript">
		
			function binary_sequence(N) {
				var x = new Array();
				for (var i=0;i<N-1;i++) {
					x[i] = (Math.random() > 0.5);
				}
				return x;
			}
					
            function draw_circles_square(x){  
              var canvas = document.getElementById('Canvas');  
              if (canvas.getContext){  
                var ctx = canvas.getContext('2d');
							
                R = 8;
                N = x.length;
                W = Math.sqrt(N);
                for (var i in x) {
                    ctx.beginPath();
                    if (x[i]) {
                        ctx.fillStyle = "rgb(0,0,0)";
                        }
                    else {
                        ctx.fillStyle = "rgb(230,230,230)";
                        }
                    
                    var j = i%W;
                    var k = Math.floor(i/W);
                    
                    ctx.arc(R+ j*2*R, R+ k*2*R, R, 0, Math.PI*2, true); 
                    ctx.closePath();
                    ctx.fill();
                }
              }  
            }
			
			function draw_circles_line(x){  
              var canvas = document.getElementById('Canvas');  
              if (canvas.getContext){  
                var ctx = canvas.getContext('2d');
							
                R = 8;
                N = x.length;
                W = Math.sqrt(N);
                for (var i in x) {
                    ctx.beginPath();
                    if (x[i]) {
                        ctx.fillStyle = "rgb(0,0,0)";
                        }
                    else {
                        ctx.fillStyle = "rgb(230,230,230)";
                        }
                    ctx.arc(R+ i*2*R, R, R, 0, Math.PI*2, true); 
                    ctx.closePath();
                    ctx.fill();
                }
              }  
            }
			
        </script>

    <title> Binary Variables</title>
    </head>
    
    <body onload="draw_circles_line( binary_sequence(100) )">
        <p align="center">
        <canvas id="Canvas" width="400" height="40"></canvas>
        </p>
    </body>
</html>
